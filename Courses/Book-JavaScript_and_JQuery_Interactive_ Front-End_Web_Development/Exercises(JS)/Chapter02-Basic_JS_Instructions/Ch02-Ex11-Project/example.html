<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Project</title>
  <link rel="stylesheet" href="../Material_Para_Ajudar/css/c02.css">
  <style>
    table {
      text-align: left;
    }
  </style>
</head>
<body>
  <h1></h1>
  <div id="content">
    <div id="greeting" class="message">Hello</div>
    <table>
      <tr>
        <th scope="row">Custom sign:</th>
        <td id="userSign"></td>
      </tr>
      <tr>
        <th scope="row">Total tiles:</th>
        <td id="tiles"></td>
      </tr>
      <tr>
        <th scope="row">Subtotal:</th>
        <td id="subTotal"></td>
      </tr>
      <tr>
        <th scope="row">Shipping:</th>
        <td id="shipping">$</td>
      </tr>
      <tr>
        <th scope="row">Grand total:</th>
        <td id="grandTotal">$</td>
      </tr>
    </table>
    <a href="#" class="action">Pay Now</a>
  </div>
  <script src="example.js"></script>
</body>
</html>
